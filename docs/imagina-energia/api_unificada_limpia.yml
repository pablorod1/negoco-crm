          nullable: true

        valor_p3_min_fee_energia:
          type: string
          description: Fee mínimo de energía para periodo P3 en €/kWh
          nullable: true

        valor_p4_max_fee_energia:
          type: string
          description: Fee máximo de energía para periodo P4 en €/kWh
          nullable: true

        valor_p4_min_fee_energia:
          type: string
          description: Fee mínimo de energía para periodo P4 en €/kWh
