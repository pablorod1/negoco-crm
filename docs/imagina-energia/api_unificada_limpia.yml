  # API de Documentos
  /documento:
    post:
      summary: Cargar documento de contrato
      description: |
        Carga un documento asociado a un contrato existente. El documento se envía
        como multipart/form-data junto con los metadatos necesarios.

        **Permisos requeridos:**
        - El contrato debe existir y pertenecer al canal autenticado
        - Si se usa impersonación de canal, debe tener los permisos adecuados

      operationId: uploadDocumento
      tags:
        - Documentos

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-Canal'

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - id_contrato
                - fichero
                - tipo_fichero
              properties:
                id_contrato:
                  type: string
                  description: Identificador único del contrato al que se asocia el documento
                  example: "12345"

                fichero:
                  type: string
                  format: binary
                  description: Archivo del documento a cargar

                tipo_fichero:
                  type: string
                  description: |
                    Tipo de documento que se está cargando.
                    Los valores permitidos se obtienen de la maestra 'tipos_documento' de la base de datos.
                  enum:
                    - "Acta de Inspección"
                    - "Acta de Puesta en Marcha"
                    - "Acuerdo reparto"
                    - "Alta sum. obras"
                    - "Alta sum. temporal"
                    - "Anexo contrato"
                    - "Anexo modificación administrativa"
                    - "Anexo modificación precios"
                    - "Anexo modificación técnica"
                    - "Baja"
                    - "Baja voluntaria definitiva"
                    - "Bono Social"
                    - "Cambio a TPV"
                    - "Cambio domiciliación"
                    - "Cambio potencia"
                    - "Cambio tarifa"
                    - "Cambio titularidad"
                    - "Cancelación contrato"
                    - "CIE consumo"
                    - "CIE generación"
                    - "Contrato"
                    - "Costes"
                    - "Desistimiento"
                    - "Devolución Fianza"
                    - "Facturas"
                    - "Fianza"
                    - "Identificador Cliente"
                    - "Mandato"
                    - "Oferta"
                    - "Otra documentación del cliente"
                    - "Otros"
                    - "Reclamación"
                    - "Respuesta a reclamación"
                    - "Socio"
                  example: "Contrato"

                fecha_firma:
                  type: string
                  format: date
                  description: Fecha de firma del documento (formato ISO 8601)
                  example: "2025-11-06"
                  nullable: true

                fecha_documento:
                  type: string
                  format: date
                  description: Fecha del documento (formato ISO 8601)
                  example: "2025-11-06"
                  nullable: true

                cups:
                  type: string
                  description: Código CUPS asociado al documento (si aplica)
                  pattern: '^ES[0-9]{16}[A-Z]{2}[0-9A-Z]{0,2}$'
                  example: "ES0031406882695001JN0F"
                  nullable: true

            encoding:
              fichero:
                contentType: application/pdf, image/png, image/jpeg, image/jpg, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document

      responses:
        '200':
          description: Documento cargado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: integer
                    description: ID único de la solicitud para seguimiento
                    example: 12345

                  result_operation:
                    type: object
                    description: Resultado de la operación devuelto por el sistema de gestión
                    properties:
                      id_documento:
                        type: string
                        description: Identificador del documento cargado
                        example: "doc_abc123"

                      url:
                        type: string
                        format: uri
                        description: URL de acceso al documento
                        example: "https://storage.example.com/documents/doc_abc123.pdf"

                      status:
                        type: string
                        description: Estado del documento
                        example: "uploaded"

              example:
                request_id: 12345
                result_operation:
                  id_documento: "doc_abc123"
                  url: "https://storage.example.com/documents/doc_abc123.pdf"
                  status: "uploaded"

        '400':
          $ref: '#/components/responses/DocumentoBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # API de Tarifas
  /tarifas:
    get:
      summary: Listar tarifas del canal
      description: |
        Obtiene el listado de tarifas disponibles para el canal autenticado.

        La petición se procesa de forma síncrona y devuelve:
        - content: Array con las tarifas disponibles
        - request_id: Identificador único de la petición para seguimiento

        **Nota sobre tarifas indexadas**: Las tarifas indexadas tienen `energia_pX_formula` en `null`
        porque su precio de energía varía según el mercado. Los valores de potencia y los límites
        (max/min) sí están informados.

        **Permisos requeridos:**
        - Token JWT válido
        - Si se usa impersonación de canal (header X-Canal), debe tener los permisos adecuados

        **Comportamiento:**
        - Sin X-Canal: Devuelve tarifas del canal por defecto del usuario autenticado
        - Con X-Canal: Devuelve tarifas del canal impersonado (requiere permisos)

      operationId: getTarifas
      tags:
        - Tarifas

      security:
        - BearerAuth: []

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-Canal'

      responses:
        '200':
          description: Tarifas obtenidas exitosamente
          content:
            application/json:
              schema:
                type: object
                required:
                  - content
                  - request_id
                properties:
                  content:
                    type: array
                    description: Array con las tarifas disponibles para el canal
                    items:
                      $ref: '#/components/schemas/Tarifa'
                  request_id:
                    type: integer
                    description: Identificador único de la petición para seguimiento y auditoría
                    example: 18

              examples:
                tarifas_exitosas:
                  summary: Ejemplo de respuesta exitosa con tarifas indexadas y fijas
                  value:
                    content:
                      - id_tarifa_precios: 11001
                        alias_externo: "REGANTES - FLEX INDEX 2.0TD"
                        descripcion: "2.0TD"
                        codigo_atr: "018"
                        tipo_tarifa_precio: "indexado"
                        precio_potencia_boe: "S"
                        precio_excedentes: null
                        potencia_p1_formula: null
                        potencia_p2_formula: null
                        potencia_p3_formula: null
                        energia_p1_formula: null
                        energia_p2_formula: null
                        energia_p3_formula: null
                        valor_p1_max_fee_energia: "30"
                        valor_p1_max_precio_potencia: "14.6"
                        valor_p1_min_fee_energia: "0"
                        valor_p1_min_precio_potencia: "0"
                      - id_tarifa_precios: 11505
                        alias_externo: "RESI - OMEGA SIN HORAS SVA AXA"
                        descripcion: "2.0TD"
                        codigo_atr: "018"
                        tipo_tarifa_precio: "fijo"
                        precio_potencia_boe: "N"
                        precio_excedentes: "0.05"
                        potencia_p1_formula: "37.74319"
                        potencia_p2_formula: "17.61636"
                        potencia_p3_formula: "0"
                        energia_p1_formula: "0.13181"
                        energia_p2_formula: "0.13181"
                        energia_p3_formula: "0.13181"
                        valor_p1_max_fee_energia: "0"
                        valor_p1_max_precio_potencia: "0"
                    request_id: 18

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          description: Sin permisos para acceder al recurso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sin_permisos:
                  summary: Sin permisos de impersonación
                  value:
                    error: "Forbidden: No tiene permisos para impersonar este canal"
                    request_id: 12345

        '500':
          $ref: '#/components/responses/InternalServerError'

        '504':
          description: Timeout al consultar el servicio de tarifas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                timeout:
                  summary: Timeout en la consulta
                  value:
                    error: "Timeout al consultar el servicio de tarifas"
                    request_id: 12345

  # API de Scoring / Credit Check
  /creditcheck:
    post:
      summary: Realizar Credit Check
      description: |
        Ejecuta una validación de riesgo para un cliente potencial de forma independiente.

        Este proceso es síncrono y devuelve el resultado de la validación inmediatamente.
        Útil para pre-validar clientes antes de iniciar el flujo de contratación completo.
      tags:
        - Scoring
      operationId: postCreditCheck
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-Canal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificador, tipo_identificador, postal_code]
              properties:
                company_name:
                  type: string
                  description: Nombre de la empresa o nombre completo si es autónomo
                  example: "ACME S.L."
                identificador:
                  type: string
                  description: NIF, NIE o CIF del cliente
                  example: "B12345678"
                tipo_identificador:
                  type: string
                  description: Tipo de documento (NIF, NIE, CIF)
                  example: "CIF"
                autonomo:
                  type: boolean
                  description: Indica si el cliente es un trabajador autónomo
                  example: false
                postal_code:
                  type: string
                  description: Código postal
                  example: "28001"
                cups:
                  type: string
                  description: CUPS del punto de suministro (opcional)
                  example: "ES0000000000000000XXXX"
                town:
                  type: string
                  description: Localidad
                  example: "Madrid"
                address:
                  type: string
                  description: Dirección completa
                  example: "Calle Alcalá 1"
                province:
                  type: string
                  description: Nombre de la provincia para traducción
                  example: "Madrid"
      responses:
        '200':
          description: Resultado del credit check obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Resultado de la validación (ACCEPT, REJECT, MANUAL_REVIEW)
                    example: "ACCEPT"
                  score:
                    type: integer
                    description: Puntuación obtenida
                    example: 85
                  message:
                    type: string
                    description: Mensaje informativo sobre el resultado
                    example: "Validación completada correctamente"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # API de Firma Digital
  /firma:
    post:
      summary: Enviar Contrato a Firma Digital
      description: |
        Envía un contrato existente para firma digital del cliente mediante email, SMS, o email con OTP.

        El contrato debe haber sido creado previamente. Este endpoint dispara el proceso de firma, enviando la comunicación al cliente por el canal especificado.

        **Flujo de uso típico:**
        1. Crear contrato con `no_enviar_firma: true`
        2. Obtener el `contrato_id` de la respuesta
        3. Llamar a `/firma` con el `contrato_id` y canal deseado
        4. El cliente recibe el email/SMS con el enlace de firma

        **Comportamiento:**
        - ✅ Operación síncrona (respuesta inmediata < 1s)
        - ✅ Reenvío permitido (útil si el cliente no recibió la comunicación)
        - ✅ Trazabilidad completa con `request_id` y `referencia_externa`

      tags:
        - Firma Digital
      operationId: postFirma
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-Canal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contrato_id
                - canal_envio
                - direcciones_firma
              properties:
                contrato_id:
                  type: integer
                  description: |
                    ID del contrato en el sistema. Se obtiene del campo `contrato_result.id` en la respuesta del endpoint de contratación.
                  example: 369877
                canal_envio:
                  type: string
                  description: |
                    Canal por el cual enviar la firma digital:
                    - **email**: Envío por correo electrónico (más común)
                    - **sms**: Envío por mensaje de texto
                    - **email_otp**: Envío dual (email + SMS con código OTP)
                  enum:
                    - email
                    - sms
                    - email_otp
                  example: "email"
                direcciones_firma:
                  type: string
                  description: |
                    Dirección(es) de destino según el canal:
                    - **Para email**: email del cliente (ej: "cliente@example.com")
                    - **Para sms**: teléfono del cliente (ej: "606123456" o "+34606123456")
                    - **Para email_otp**: email;teléfono separados por ; (ej: "cliente@example.com;606123456")

                    **Validaciones:**
                    - Email: formato RFC estándar (nombre@dominio.tld)
                    - Teléfono: 8-15 dígitos, opcional prefijo internacional +
                  example: "cliente@example.com"
                  pattern: '^[\w\.-]+@[\w\.-]+\.\w+|[\+]?[0-9]{8,15}|[\w\.-]+@[\w\.-]+\.\w+;[\+]?[0-9]{8,15}$'
                referencia_externa:
                  type: string
                  description: |
                    Referencia opcional para vincular con sistemas externos (CRM, tickets, etc.).
                    Útil para tracking y auditoría.
                  example: "CRM-DEAL-12345"
                  nullable: true
            examples:
              email_simple:
                summary: Envío por email (caso más común)
                value:
                  contrato_id: 369877
                  canal_envio: "email"
                  direcciones_firma: "cliente@example.com"
                  referencia_externa: "CRM-DEAL-12345"
              sms:
                summary: Envío por SMS
                value:
                  contrato_id: 369877
                  canal_envio: "sms"
                  direcciones_firma: "606123456"
              email_otp:
                summary: Email con OTP (doble factor)
                value:
                  contrato_id: 369877
                  canal_envio: "email_otp"
                  direcciones_firma: "cliente@example.com;606123456"
                  referencia_externa: "CONTRATO-ALTO-VALOR"
              reenvio:
                summary: Reenvío (cliente no recibió)
                value:
                  contrato_id: 369877
                  canal_envio: "email"
                  direcciones_firma: "cliente@example.com"
                  referencia_externa: "REENVIO-001"
      responses:
        '200':
          description: Firma enviada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: integer
                    description: ID único del request en `webhooks.request_firma`. Úsalo para auditoría y troubleshooting.
                    example: 12345
                  firma_result:
                    type: object
                    description: Respuesta completa del sistema de gestión
                    properties:
                      status:
                        type: string
                        example: "success"
                      message:
                        type: string
                        example: "Contrato enviado para firma digital"
                  referencia_externa:
                    type: string
                    description: Referencia externa proporcionada en el request (si se envió)
                    nullable: true
                    example: "CRM-DEAL-12345"
              example:
                request_id: 12345
                firma_result:
                  status: "success"
                  message: "Contrato enviado para firma digital"
                referencia_externa: "CRM-DEAL-12345"
        '400':
          description: Error de validación de parámetros
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                falta_contrato_id:
                  summary: Falta parámetro contrato_id
                  value:
                    error: "Error de validación: El parámetro 'contrato_id' es requerido"
                    request_id: 12345
                falta_canal_envio:
                  summary: Falta parámetro canal_envio
                  value:
                    error: "Error de validación: El parámetro 'canal_envio' es requerido"
                    request_id: 12345
                falta_direcciones:
                  summary: Falta parámetro direcciones_firma
                  value:
                    error: "Error de validación: El parámetro 'direcciones_firma' es requerido"
                    request_id: 12345
                contrato_id_invalido:
                  summary: contrato_id no es un número
                  value:
                    error: "Error de validación: 'contrato_id' debe ser un número entero"
                    request_id: 12345
                canal_invalido:
                  summary: Canal de envío no válido
                  value:
                    error: "Error de validación: canal_envio debe ser 'email', 'sms' o 'email_otp'"
                    request_id: 12345
                email_invalido:
                  summary: Formato de email incorrecto
                  value:
                    error: "Error de validación: El email en 'direcciones_firma' es inválido"
                    request_id: 12345
                telefono_invalido:
                  summary: Formato de teléfono incorrecto
                  value:
                    error: "Error de validación: El teléfono en 'direcciones_firma' es inválido"
                    request_id: 12345
                json_malformado:
                  summary: JSON malformado en el body
                  value:
                    error: "Error de request, no se reconoce el cuerpo JSON"
                    request_id: 12345
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Contrato no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Error en firma digital: Error sending contract for signature: 404 Client Error: Not Found"
                request_id: 12345
        '500':
          description: Error interno del servidor o error en el sistema de gestión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                api_error:
                  summary: Error en el sistema de gestión
                  value:
                    error: "Error en firma digital: Error sending contract for signature: 502 Bad Gateway"
                    request_id: 12345
                api_timeout:
                  summary: Timeout en el sistema
                  value:
                    error: "Error en firma digital: Timeout connecting to backend API"
                    request_id: 12345
                config_error:
                  summary: Error de configuración del servidor
                  value:
                    error: "Error de servidor, por favor contacte con serviciosistemas@imaginaenergia.com"
                    request_id: 12345

  /firma/reenviar:
    post:
      summary: Reenviar Solicitud de Firma
      description: |
        Reenvía una solicitud de firma existente al cliente. Útil para recordatorios o cuando el cliente no recibió la comunicación inicial.

        **Validación de permisos:** El sistema verifica que tu canal JWT tenga autorización sobre el contrato asociado al circuito_id.

        **Comportamiento:**
        - ✅ Operación síncrona (respuesta inmediata < 2s)
        - ✅ Sin límite de reenvíos
        - ⚠️ Buenas prácticas: Evitar reenvíos muy frecuentes (mín. 1 hora)

      tags:
        - Gestión de Firma
      operationId: postReenviarFirma
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-Canal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - circuito_id
              properties:
                circuito_id:
                  type: string
                  description: ID de la solicitud de firma (obtenido de POST /firma)
                  example: "123456"
                mode:
                  type: string
                  enum: [ds, os, ud]
                  default: ds
                  description: Modo de firma (ds=drawing signature, os=one-time certificate, ud=upload & draw)
                  example: "ds"
                referencia_externa:
                  type: string
                  maxLength: 100
                  description: Tu referencia interna para tracking
                  example: "REENVIO-2024-001"
      responses:
        '200':
          description: Solicitud reenviada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: integer
                  firma_result:
                    type: object
                  referencia_externa:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permisos sobre el circuito_id
        '404':
          description: Circuito_id no encontrado
        '500':
          $ref: '#/components/responses/InternalServerError'

  /firma/{circuito_id}:
    get:
      summary: Consultar Estado de Firma
      description: |
        Obtiene información detallada del estado actual de una solicitud de firma, incluyendo datos de todos los firmantes.

        **Información incluida:**
        - Estado general de la solicitud
        - Listado completo de firmantes con estado individual
        - Fecha/hora de firma e IP (para auditoría)
        - Porcentaje de progreso

        **Notificación automática:** Cuando todos los firmantes completan, el contrato cambia a Estado: 1, Subestado: 50 (Firmado) y se envía webhook automático.

      tags:
        - Gestión de Firma
      operationId: getEstadoFirma
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-Canal'
        - name: circuito_id
          in: path
          required: true
          description: ID de la solicitud de firma
          schema:
            type: string
          example: "123456"
        - name: referencia_externa
          in: query
          required: false
          description: Tu referencia interna para tracking
          schema:
            type: string
            maxLength: 100
          example: "CONSULTA-001"
      responses:
        '200':
          description: Estado obtenido exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: integer
                  solicitud:
                    type: object
                    properties:
                      id:
                        type: string
                      estado:
                        type: string
                        enum: [en_proceso, completado, cancelado]
                      created_at:
                        type: string
                        format: date-time
                  firmantes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        nombre:
                          type: string
                        email:
                          type: string
                        telefono:
                          type: string
                        completado:
                          type: boolean
                        fecha_firma:
                          type: string
                          format: date-time
                          nullable: true
                        ip_firma:
                          type: string
                          nullable: true
                  progreso:
                    type: object
                    properties:
                      total_firmantes:
                        type: integer
                      firmantes_completados:
                        type: integer
                      porcentaje_completado:
                        type: number
                      estado_general:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Sin permisos sobre el circuito_id
        '404':
          description: Circuito_id no encontrado
        '500':
          $ref: '#/components/responses/InternalServerError'

  /firma-health:
    get:
      summary: Health Check del Endpoint de Firma
      description: |
        Endpoint de verificación de salud para monitoreo del servicio de firma digital.
        No requiere autenticación.
      tags:
        - Firma Digital
      operationId: getFirmaHealth
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
