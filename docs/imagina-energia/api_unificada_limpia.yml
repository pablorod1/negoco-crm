    ListaContratosResponse:
      type: object
      description: |
        Respuesta con listado de contratos del canal.
      properties:
        request_id:
          type: integer
          description: ID único de la solicitud para seguimiento
          example: 158

        pagina:
          type: integer
          description: Número de página actual
          example: 1

        num_contratos:
          type: integer
          description: Número de contratos devueltos en esta página
          example: 5

        contratos:
          type: array
          description: Lista de contratos en la página actual
          items:
            $ref: '#/components/schemas/ContratoInfo'

      required:
        - request_id
        - pagina
        - num_contratos
        - contratos

    ContratoInfo:
      type: object
      description: |
        Información del contrato de suministro devuelta en el listado.
      properties:
        id:
          type: integer
          description: Identificador único del contrato
          example: 346663

        codigo:
          type: string
          description: Código del contrato
          example: "00028517"

        alias_externo:
          type: string
          description: Alias externo del contrato (referencia del canal)
          example: "C00050803"

        estado:
          type: object
          description: Estado actual del contrato
          properties:
            id:
              type: integer
              example: 5
            estado:
              type: string
              example: "finalizado"
            descripcion:
              type: string
              example: "Finalizado"

        subestado:
          type: object
          description: Subestado del contrato
          properties:
            id:
              type: integer
              example: 19
            id_estado:
              type: integer
              example: 5
            subestado:
              type: string
              example: "finalizado"
            descripcion:
              type: string
              example: "Finalizado"

        fecha_inicio:
          type: string
          format: date
          description: Fecha de inicio del suministro
          example: "2023-04-01"

        fecha_fin:
          type: string
          format: date
          description: Fecha de fin del contrato
          example: "2023-04-17"

        fecha_firma:
          type: string
          format: date
          description: Fecha de firma del contrato
          example: "2023-03-16"

        consumo_anual_estimado:
          type: string
          description: Consumo anual estimado en Wh
          example: "3280000"

        atributos:
          type: object
          description: Atributos adicionales del contrato
          properties:
            potencia_contratada:
              type: string
              description: Potencias contratadas por periodo (JSON string)
              example: "[\"4400\",\"4400\",0,0,0,0]"

        cliente:
          type: object
          description: Información del titular del contrato
          properties:
            identificador:
              type: string
              description: DNI/NIE/CIF del titular
              example: "02536092C"
            nombre_completo:
              type: string
              description: Nombre completo del titular
              example: "Cristina Moron Blanco"
            correo_electronico:
              type: string
              format: email
              description: Email del titular
              example: "cliente@ejemplo.com"
            telefono_1:
              type: string
              description: Teléfono principal del titular
              example: "667435899"
            tipo_persona:
              type: object
              description: Tipo de persona (física/jurídica)
              properties:
                id:
                  type: integer
                codigo:
                  type: string
                  example: "F"
                descripcion:
                  type: string
                  example: "Física"
            tabla_direcciones:
              type: object
              description: Dirección del cliente
              properties:
                direccion_completa:
                  type: string
                  example: "Calle Alonsario 34 Puerta 9 21730"
                cod_postal:
                  type: string
                  example: "21730"
                municipio_provincia:
                  type: string
                  example: "Almonte (Huelva)"

        punto_suministro:
          type: object
          description: Información del punto de suministro
          properties:
            cups:
              type: string
              description: Código CUPS
              example: "ES0133000002012018ZM"
            direccion:
              type: object
              description: Dirección del punto de suministro
              properties:
                direccion_completa:
                  type: string
                  example: "Calle Alonsario 34 Puerta 9 21730"
                cod_postal:
                  type: string
                  example: "21730"
                municipio_provincia:
                  type: string
                  example: "Almonte (Huelva)"

        tarifa_precio:
          type: object
          description: Información de la tarifa
          properties:
            id:
              type: integer
              description: ID de la tarifa
              example: 8252
            alias_externo:
              type: string
              description: Nombre/alias de la tarifa
              example: "0223 - PLAN SIN HORAS (10346)"

    ContratoResidencialRequest:
      type: object
      description: |
        Payload para alta de contrato residencial (Universal). Soporta modelos C1, C2 y A3.
        Los valores se validan contra tablas maestras.
      properties:
        # Punto de suministro
        cups:
          type: string
          description: CUPS del punto de suministro (se recortará a 20 caracteres si excede)
          example: ES0026000010979933FW
        provincia:
          $ref: '#/components/schemas/Provincia'
        municipio:
          $ref: '#/components/schemas/Municipio'
        cod_postal:
          type: string
          pattern: '^\d{5}$'
          description: Código postal (5 dígitos)
          example: "28001"
        calle:
          type: string
          example: "Calle de Alcalá"
        numero_finca:
          type: string
          example: "1"
        tipo_via_cnmc:
          $ref: '#/components/schemas/TipoViaCnmc'
        aclarador_finca:
          type: string
          nullable: true
          description: Portal, escalera, piso, letra, etc.
          example: "2ºB"

        # Contrato y facturación
        potencia_contratada:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: number
            description: Potencia en W para cada periodo (P1..P6). Acepta valores null.
          example: [4600, 4600, 0, 0, 0, 0]
        id_tarifa:
          type: integer
          description: Identificador interno de la tarifa/precio
          example: 10350
        iban:
          type: string
          description: IBAN para domiciliación
          example: ES9121000418450200051332

        # Datos del titular
        nombre_titular:
          type: string
          example: Juan
        primer_apellido_titular:
          type: string
          example: Pérez
        tipo_documento_titular:
          type: string
          description: Tipo de documento del titular
          enum: [NIF, NIE, CIF, Pasaporte]
          example: NIF
        numero_documento_titular:
          type: string
          example: 12345678A
        telefono_titular:
          type: string
          example: "600000000"
        prefijo_telefono_titular:
          type: string
          description: Prefijo internacional sin signo '+'
          example: "34"
        email_titular:
          type: string
          format: email
          example: juan@example.com

        # Datos del firmante (firma electronica)
        telefono_firmante:
          type: string
          description: Telefono del firmante (opcional). Si no se informa, se usa telefono_titular. Aplica para sms o email_otp.
          example: "600000000"
        email_firmante:
          type: string
          format: email
          description: Email del firmante (opcional). Si no se informa, se usa email_titular. Aplica para email o email_otp.
          example: firmante@ejemplo.com

        # Dirección titular
        provincia_titular:
          $ref: '#/components/schemas/Provincia'
        municipio_titular:
          $ref: '#/components/schemas/Municipio'
        cod_postal_titular:
          type: string
          pattern: '^\d{5}$'
          example: "28001"
        calle_titular:
          type: string
          example: "Calle de Alcalá"
        numero_finca_titular:
          type: string
          example: "1"
        tipo_via_titular_cnmc:
          $ref: '#/components/schemas/TipoViaCnmc'
        aclarador_finca_titular:
          type: string
          nullable: true
          example: "2ºB"

        # Autoconsumo (opcional)
        tipo_autoconsumo_cnmc:
          $ref: '#/components/schemas/TipoAutoconsumoCnmc'

        # Operación y opciones
        no_credit_check:
          type: boolean
          description: Si true, salta el credit check
          default: false
        no_enviar_firma:
          type: boolean
          description: Si true, elude enviar el contrato a firma y espera que se rellene el campo fecha_firma_datos
          default: false
        canal_envio:
          type: string
          description: Canal de envio para firma. Si telefono_firmante/email_firmante no se informan, se usan los del titular.
          enum: [sms, email, email_otp]
          example: email
        callback_url:
          type: string
          format: uri
          description: URL para callback; si se informa, el procesamiento será asíncrono
          example: https://miapp.example.com/webhooks/contrata
        referencia_externa:
          type: string
          description: Referencia externa opcional proporcionada por el cliente para identificar su propia petición. Se devolverá en la respuesta y en los callbacks para facilitar la trazabilidad.
          example: "REF-2026-001234"

        # Opción de inicio de contrato
        inicio_contrato:
          type: string
          description: Indica cuándo se ha de iniciar el contrato.
          enum: [cuanto_antes, fecha_fija]
          default: cuanto_antes
          example: cuanto_antes
        fecha_inicio:
          type: string
          format: date
          nullable: true
          description: 'Fecha en la que se ha de iniciar el contrato (formato YYYY-MM-DD). Es obligatorio informarlo si inicio_contrato es "fecha_fija".'
          example: "2026-03-01"

        # Fecha de firma (opcional)
        fecha_firma_datos:
          type: string
          format: date
          nullable: true
          description: 'Fecha en la que el cliente ha firmado el contrato (formato YYYY-MM-DD). Es obligatorio informarlo si no se envía a firma el contrato "no_enviar_firma": true.'
          example: "2026-01-28"

        # Tipo de Operación
        es_alta_nueva:
          type: boolean
          description: Si true, indica que es una nueva alta (modelo A3). Si false o nulo, es un cambio de comercializadora (C1/C2).
          default: false
          example: false
        mismo_titular:
          type: boolean
          description: Si true, el titular es el mismo. Si false, se trata de un cambio de titular (modelo C2).
          default: true
          example: true
        misma_potencia:
          type: boolean
          description: Si true, no hay cambios de potencia. Si false, hay cambios técnicos (modelo C2).
          default: true
          example: true

      required:
        - cups
        - provincia
        - municipio
        - cod_postal
        - calle
        - numero_finca
        - tipo_via_cnmc
        - potencia_contratada
        - id_tarifa
        - iban
        - nombre_titular
        - tipo_documento_titular
        - numero_documento_titular
        - telefono_titular
        - prefijo_telefono_titular
        - email_titular
        - provincia_titular
        - municipio_titular
        - cod_postal_titular
        - calle_titular
        - numero_finca_titular
        - tipo_via_titular_cnmc
        - canal_envio

    ContratoEmpresaRequest:
      type: object
      description: |
        Payload para alta de contrato empresa (Universal). Soporta modelos C1, C2 y A3.
        Los valores se validan contra tablas maestras. Este endpoint está diseñado para personas jurídicas (empresas).
      properties:
        # Punto de suministro
        cups:
          type: string
          description: CUPS del punto de suministro (se recortará a 20 caracteres si excede)
          example: ES0026000010979933FW
        provincia:
          $ref: '#/components/schemas/Provincia'
        municipio:
          $ref: '#/components/schemas/Municipio'
        cod_postal:
          type: string
          pattern: '^\d{5}$'
          description: Código postal (5 dígitos)
          example: "28001"
        calle:
          type: string
          example: "Calle de Alcalá"
        numero_finca:
          type: string
          example: "1"
        tipo_via_cnmc:
          $ref: '#/components/schemas/TipoViaCnmc'
        aclarador_finca:
          type: string
          nullable: true
          description: Portal, escalera, piso, letra, oficina, etc.
          example: "Oficina 2B"

        # Contrato y facturación
        potencia_contratada:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: number
            description: Potencia en W para cada periodo (P1..P6). Acepta valores null.
          example: [4600, 4600, 0, 0, 0, 0]
        id_tarifa:
          type: integer
          description: Identificador interno de la tarifa/precio
          example: 10350
        id_cnae:
          type: string
          description: Código CNAE de la actividad económica de la empresa (obligatorio para empresas)
          example: "Actividades de los hogares como productores de servicios para uso propio"
        iban:
          type: string
          description: IBAN para domiciliación
          example: ES9121000418450200051332

        # Datos del titular (empresa/persona jurídica)
        razon_social_titular:
          type: string
          description: Razón social de la empresa
          example: ACME CORPORATION S.L.
        numero_documento_titular:
          type: string
          description: NIF de la empresa (antes llamado CIF)
          example: B12345678
        telefono_titular:
          type: string
          description: Teléfono de contacto de la empresa
          example: "910000000"
        prefijo_telefono_titular:
          type: string
          description: Prefijo internacional sin signo '+' (obligatorio)
          example: "34"
        email_titular:
          type: string
          format: email
          description: Email de contacto de la empresa
          example: admin@acme.com

        # Dirección del titular (empresa)
        provincia_titular:
          $ref: '#/components/schemas/Provincia'
        municipio_titular:
          $ref: '#/components/schemas/Municipio'
        cod_postal_titular:
          type: string
          pattern: '^\d{5}$'
          example: "28001"
        calle_titular:
          type: string
          example: "Calle de Alcalá"
        numero_finca_titular:
          type: string
          example: "1"
        tipo_via_titular_cnmc:
          $ref: '#/components/schemas/TipoViaCnmc'
        aclarador_finca_titular:
          type: string
          nullable: true
          example: "Oficina 2B"

        # Datos del firmante (persona física que firma por la empresa)
        nombre_firmante:
          type: string
          description: Nombre de la persona física que firma el contrato
          example: Juan
        primer_apellido_firmante:
          type: string
          description: Primer apellido del firmante
          example: Pérez
        tipo_documento_firmante:
          type: string
          description: Tipo de documento del firmante (persona física)
          enum: [NIF, NIE, Pasaporte]
          example: NIF
        numero_documento_firmante:
          type: string
          description: Número de documento del firmante
          example: 12345678A
        telefono_firmante:
          type: string
          description: Telefono del firmante (opcional). Si no se informa, se usa telefono_titular. Aplica para sms o email_otp.
          example: "600000000"
        prefijo_telefono_firmante:
          type: string
          description: Prefijo internacional del firmante sin signo '+' (obligatorio)
          example: "34"
        email_firmante:
          type: string
          format: email
          description: Email del firmante (opcional). Si no se informa, se usa email_titular. Aplica para email o email_otp.
          example: juan.perez@acme.com

        # Autoconsumo (opcional)
        tipo_autoconsumo_cnmc:
          $ref: '#/components/schemas/TipoAutoconsumoCnmc'

        # Operación y opciones
        no_credit_check:
          type: boolean
          description: Si true, salta el credit check
          default: false
        no_enviar_firma:
          type: boolean
          description: Si true, elude enviar el contrato a firma y espera que se rellene el campo fecha_firma_datos
          default: false
        canal_envio:
          type: string
          description: Canal de envio para firma. Si telefono_firmante/email_firmante no se informan, se usan los del titular.
          enum: [sms, email, email_otp]
          example: email
        callback_url:
          type: string
          format: uri
          description: URL para callback; si se informa, el procesamiento será asíncrono
          example: https://miapp.example.com/webhooks/contrata
        referencia_externa:
          type: string
          description: Referencia externa opcional proporcionada por el cliente para identificar su propia petición. Se devolverá en la respuesta y en los callbacks para facilitar la trazabilidad.
          example: "REF-2026-001234"

        # Opción de inicio de contrato
        inicio_contrato:
          type: string
          description: Indica cuándo se ha de iniciar el contrato.
          enum: [cuanto_antes, fecha_fija]
          default: cuanto_antes
          example: cuanto_antes
        fecha_inicio:
          type: string
          format: date
          nullable: true
          description: 'Fecha en la que se ha de iniciar el contrato (formato YYYY-MM-DD). Es obligatorio informarlo si inicio_contrato es "fecha_fija".'
          example: "2026-03-01"

        # Fecha de firma (opcional)
        fecha_firma_datos:
          type: string
          format: date
          nullable: true
          description: 'Fecha en la que el cliente ha firmado el contrato (formato YYYY-MM-DD). Es obligatorio informarlo si no se envía a firma el contrato "no_enviar_firma": true.'
          example: "2026-01-28"

        # Tipo de Operación
        es_alta_nueva:
          type: boolean
          description: Si true, indica que es una nueva alta (modelo A3). Si false o nulo, es un cambio de comercializadora (C1/C2).
          default: false
          example: false
        mismo_titular:
          type: boolean
          description: Si true, el titular es el mismo. Si false, se trata de un cambio de titular (modelo C2).
          default: true
          example: true
        misma_potencia:
          type: boolean
          description: Si true, no hay cambios de potencia. Si false, hay cambios técnicos (modelo C2).
          default: true
          example: true

      required:
        - cups
        - provincia
        - municipio
        - cod_postal
        - calle
        - numero_finca
        - tipo_via_cnmc
        - potencia_contratada
        - id_tarifa
        - id_cnae
        - iban
        - razon_social_titular
        - numero_documento_titular
        - telefono_titular
        - prefijo_telefono_titular
        - email_titular
        - provincia_titular
        - municipio_titular
        - cod_postal_titular
        - calle_titular
        - numero_finca_titular
        - tipo_via_titular_cnmc
        - nombre_firmante
        - primer_apellido_firmante
        - tipo_documento_firmante
        - numero_documento_firmante
        - prefijo_telefono_firmante
        - canal_envio

    ContratoResidencialResponseSuccess:
      type: object
      properties:
        request_id:
          type: integer
          description: ID único de la petición
          example: 408
        credit_result:
          $ref: '#/components/schemas/CreditResult'
        contrato_result:
          $ref: '#/components/schemas/ContratoResult'
        firma_result:
          $ref: '#/components/schemas/FirmaResult'
        referencia_externa:
          type: string
          nullable: true
          description: Referencia externa proporcionada en el request original
          example: "REF-2026-001234"

    ContratoEmpresaResponseSuccess:
      type: object
      properties:
        request_id:
          type: integer
          description: ID único de la petición
          example: 408
        credit_result:
          $ref: '#/components/schemas/CreditResult'
        contrato_result:
          $ref: '#/components/schemas/ContratoResult'
        firma_result:
