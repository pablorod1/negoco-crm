openapi: 3.0.3
info:
  title: API Completa - Contratos, Documentos y Autenticación
  description: |
    API unificada para la gestión de contratos, documentos y autenticación.

    ## Autenticación

    Todas las solicitudes requieren autenticación mediante JWT Bearer token.

    ### Obtener un Token JWT

    Para obtener su token JWT, debe iniciar sesión con sus credenciales en:

    POST https://oezimzeqmtmncuipqgwd.supabase.co/functions/v1/initiateauthcommand

    **Cuerpo de la solicitud:**
    ```json
    {
      "email": "su_usuario@ejemplo.com",
      "password": "su_contraseña"
    }
    ```

    **Respuesta exitosa:**
    ```json
    {
      "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
      "expires_in": 3600
    }
    ```

    ### Usar el Token

    Incluya el token en el encabezado Authorization de todas sus solicitudes:

    Authorization: Bearer <su_token_jwt>

    ### Impersonación de Canal (Opcional)

    Si su cuenta tiene permisos de impersonación de canal, puede actuar en nombre de otro canal
    incluyendo el encabezado X-Canal con el ID del permiso que le proporcionó el administrador.

    ## Guía de Autenticación

    La autenticación se basa en el estándar JSON Web Token (JWT). Cada solicitud debe incluir
    un token JWT válido en el encabezado de autorización para acceder a los recursos protegidos.

    ### Impersonación de Canal

    Si su cuenta tiene permisos de impersonación de canal, puede actuar en nombre de diferentes canales.
    La impersonación de canal le permite realizar operaciones en nombre de un canal específico en
    lugar de usar su canal por defecto.

    **Requisitos:**
    - El permiso impersonar_canal asignado a su usuario
    - Un ID de permiso específico proporcionado por el administrador para cada canal que puede impersonar

    **Uso:**
    Incluya el encabezado X-Canal en su solicitud con el ID de permiso. El valor de X-Canal debe ser
    el ID del permiso específico que le proporcionó el administrador, no el ID del canal directamente.

    **Comportamiento:**
    - Si NO incluye el encabezado X-Canal: Las operaciones se realizarán usando su canal por defecto
    - Si incluye X-Canal con un ID válido: Las operaciones se realizarán en nombre del canal impersonado
    - Si incluye X-Canal pero no tiene permisos: Recibirá un error de autorización

    ### Códigos de Error de Autenticación

    | Código | Descripción |
    |--------|-------------|
    | 401 Unauthorized | Token JWT inválido, expirado o ausente |
    | 401 Unauthorized | Error en la autorización de impersonación de canal |
    | 403 Forbidden | No tiene permisos para realizar esta operación |

    ### Mejores Prácticas de Seguridad

    - Nunca comparta su token JWT con otras personas
    - No incluya el token en URLs o logs públicos
    - Almacene el token de forma segura en variables de entorno
    - Renueve el token periódicamente si está próximo a expirar

  version: 1.2.0
  contact:
    email: serviciosistemas@imaginaenergia.com

servers:
  - url: https://oezimzeqmtmncuipqgwd.supabase.co/functions/v1
    description: Servidor de PRE (Auth)
  - url: https://pre-webhooks.imaginaenergia.com
    description: Servidor PRE para APIs

security:
  - BearerAuth: []

paths:
  # Endpoint de autenticación
  /initiateauthcommand:
    post:
      tags: [Autenticación]
      summary: Obtener token JWT
      description: Endpoint de autenticación para obtener un JWT válido.
      servers:
        - url: https://oezimzeqmtmncuipqgwd.supabase.co/functions/v1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: su_usuario@ejemplo.com
                password:
                  type: string
                  format: password
                  example: su_contraseña
            examples:
              login_ejemplo:
                value:
                  email: su_usuario@ejemplo.com
                  password: su_contraseña
      responses:
        '200':
          description: Token emitido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT emitido
                  expires_in:
                    type: integer
                    description: Tiempo de validez en segundos
              examples:
                token_exitoso:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    expires_in: 3600
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Endpoint de Clave Pública
  /public_key:
    get:
      summary: Obtener clave pública RSA
      description: |
        Devuelve la clave pública RSA del servidor en formato PEM.
        Los clientes deben usar esta clave para cifrar información sensible antes de enviarla a la API.
      operationId: getPublicKey
      tags:
        - Seguridad
      security: []
      responses:
        '200':
          description: Clave pública devuelta correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key:
                    type: string
                    description: Clave pública RSA en formato PEM.
                    example: |
                      -----BEGIN PUBLIC KEY-----
                      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAv6pB...
                      -----END PUBLIC KEY-----
        '500':
          description: Error interno del servidor

  # API de Contratos
  /contrato/{id_contrato}:
    get:
      summary: Consultar contrato por ID
      description: |
        Obtiene la información completa de un contrato de suministro específico.

        **Permisos requeridos:**
        - El contrato debe existir y pertenecer al canal autenticado
        - Si se usa impersonación de canal, debe tener los permisos adecuados

        **Nota:** Solo se devuelve información del contrato si el canal tiene permisos sobre él.

      operationId: getContrato
      tags:
        - Contratos

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-Canal'
        - name: id_contrato
          in: path
          description: |
            Identificador único del contrato que se desea consultar.

            **Importante:** Solo se puede consultar un contrato si pertenece al canal autenticado
            o al canal impersonado (si se está usando impersonación).
          required: true
          schema:
            type: integer
          example: 346663

      responses:
        '200':
          description: Contrato encontrado y devuelto exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: integer
                    description: ID único de la solicitud para seguimiento
                    example: 159

                  contrato:
                    $ref: '#/components/schemas/ContratoInfo'

              example:
                request_id: 159
                contrato:
                  id: 346663
                  codigo: "00028517"
                  alias_externo: "C00050803"
                  estado:
                    id: 5
                    estado: "finalizado"
                    descripcion: "Finalizado"
                  subestado:
                    id: 19
                    id_estado: 5
                    subestado: "finalizado"
                    descripcion: "Finalizado"
                  fecha_inicio: "2023-04-01"
                  fecha_fin: "2023-04-17"
                  fecha_firma: "2023-03-16"
                  consumo_anual_estimado: "3280000"
                  atributos:
                    potencia_contratada: "[\"4400\",\"4400\",0,0,0,0]"
                  cliente:
                    identificador: "02536092C"
                    nombre_completo: "Cristina Moron Blanco"
                    correo_electronico: "cliente@ejemplo.com"
                    telefono_1: "667435899"
                  punto_suministro:
                    cups: "ES0133000002012018ZM"
                  tarifa_precio:
                    id: 8252
                    alias_externo: "0223 - PLAN SIN HORAS (10346)"

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ContratoNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # API de Listado de Contratos
  /contratos:
    get:
      summary: Listar contratos
      description: |
        Obtiene un listado paginado de contratos de suministro del canal autenticado.

        **Paginación:**
        - Usa los parámetros `pagina` y `por_pagina` para controlar la paginación
        - La respuesta incluye `num_contratos` indicando cuántos contratos se devuelven en la página

        **Permisos requeridos:**
        - Solo se devuelven contratos que pertenezcan al canal autenticado
        - Si se usa impersonación de canal (header X-Canal), se devuelven los contratos del canal impersonado

        **Nota:** Este endpoint es síncrono y devuelve los resultados inmediatamente.

      operationId: listarContratos
      tags:
        - Contratos

      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/X-Canal'
        - name: pagina
          in: query
          description: |
            Número de página a recuperar (comienza en 1).
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: por_pagina
          in: query
          description: |
            Número de contratos por página.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
          example: 100

      responses:
        '200':
          description: Listado de contratos devuelto exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaContratosResponse'
              example:
                request_id: 158
                pagina: 1
                num_contratos: 5
                contratos:
                  - id: 346663
                    codigo: "00028517"
                    alias_externo: "C00050803"
                    estado:
                      id: 5
                      estado: "finalizado"
                      descripcion: "Finalizado"
                    subestado:
                      id: 19
                      id_estado: 5
                      subestado: "finalizado"
                      descripcion: "Finalizado"
                    fecha_inicio: "2023-04-01"
                    fecha_fin: "2023-04-17"
                    fecha_firma: "2023-03-16"
                    consumo_anual_estimado: "3280000"
                    atributos:
                      potencia_contratada: "[\"4400\",\"4400\",0,0,0,0]"
                    cliente:
                      identificador: "02536092C"
                      nombre_completo: "Cristina Moron Blanco"
                      correo_electronico: "cliente@ejemplo.com"
                      telefono_1: "667435899"
                    punto_suministro:
                      cups: "ES0133000002012018ZM"
                    tarifa_precio:
                      id: 8252
                      alias_externo: "0223 - PLAN SIN HORAS (10346)"

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # API de Contrato Empresa
  /contrato/empresa:
    post:
      summary: Alta de contrato empresa (Modelos C2, A3 y C1)
      description: |
        Orquesta validaciones (maestras + esquema), credit check y envío a firma electrónica para empresas (personas jurídicas).

        Soporta los modelos C2 y A3, además del modelo tradicional C1.

        - Si se incluye callback_url, la petición se encola y se devuelve 202 inmediatamente.
        - Es obligatorio indicar canal_envio (valores permitidos: sms, email, email_otp).
        - Requiere datos del titular (empresa) y del firmante (persona física que firma por la empresa).

        El procesado del request primero hace el credit check, luego la contratación y
        finalmente el envío a firma (no activado en entorno PRE).
      operationId: postContratoEmpresa
      tags:
        - Contratos
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/X-Canal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContratoEmpresaRequest'
      responses:
        '202':
          description: Solicitud aceptada para procesamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoEmpresaResponseSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

